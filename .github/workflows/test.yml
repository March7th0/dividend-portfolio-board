name: tests

# push/PR 时自动跑全部 21 套件 / 916 项断言(与本地 tests/run_all.js 同一入口)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 最小可用权限:contents:read 是 checkout 私有仓的下限——写成 {} 在私有仓会
# "Repository not found"(公开仓匿名可读所以看不出来),别改回 {}
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node 24(与本地同版本)
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 安装 jsdom(版本与本地一致)
        run: |
          mkdir -p .ci-deps
          npm install --prefix .ci-deps jsdom@30.1.1

      - name: 跑全部测试套件
        env:
          NODE_PATH: ${{ github.workspace }}/.ci-deps/node_modules
        run: node tests/run_all.js